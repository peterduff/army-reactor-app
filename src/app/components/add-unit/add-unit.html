<div id="add-unit">
    <div class="absolute top-10 w-full h-calc">
        @for (unit of activeBook.units; track unit) {
            <div class="border-b-1 border-b-zinc-200">
                <div class="w-full rounded relative">
                    <p class="py-2 px-3 w-4/5  tracking-widest font-normal whitespace-nowrap overflow-clip text-ellipsis">{{unit.name}}</p>
                    <div class="absolute top-1 right-1 w-1/5 h-8 rounded bg-lime-600 text-center content-center">
                        <p class="text-white text-xl font-normal content-center"><span class="text-lime-300 pe-1">+</span>{{calculationService.calculateUnitPoints(unit)}}</p>
                    </div>
                </div>
            </div>
        }
    </div>
</div>

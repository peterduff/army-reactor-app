<div id="home">
    @if(core) {
        <div class="absolute top-10 w-full h-calc bg-zinc-700 text-white font-light">
            <div class="m-2">
                <button class="w-full rounded py-2 px-3 bg-lime-600 text-white tracking-widest font-normal" routerLink="/newlist">NEW LIST</button>
            </div>
            <div class="mx-2 my-4">
                @for (config of core.configs | configFilter:rosters; track config.id) {
                    <h2 class="mb-2">{{config.name}}</h2>

                    @for (roster of rosters | rosterFilter:config.rulesetId; track roster) {
                        <div class="w-full bg-zinc-600 rounded mb-2 relative">
                            <p class="py-2 px-3 w-3/4">{{roster.name}}</p>
                            <div class="absolute top-0 right-10 w-10 h-10 content-end text-center" (click)="duplicateRoster(roster)">
                                <ng-icon name="heroSquare2Stack" color="lightgrey" size="26" />
                            </div>
                            <div class="absolute top-0 right-0 w-10 h-10 pt-1 text-center" (click)="deleteId = roster.uuid">
                                <ng-icon name="heroXMarkSolid" color="red" size="32" />
                            </div>
                        </div>
                    }
                }
            </div>
        </div>
    }

    @if (deleteId) {
        <div id="deleteRoster" class="absolute top-0 bottom-0 left-0 right-0">
            <div class="inline">
                <div class="grid grid-cols-1 place-content-center h-full">
                    <div class="bg-white rounded w-2/3 opacity-100 justify-self-center p-3">
                        <p class="mb-3 text-center text-lg">Are you sure you wish to delete this roster?</p>

                        <div class="grid grid-cols-2">
                            <div>
                                <button class="rounded py-2 px-3 tracking-widest font-normal w-full" (click)="deleteId = ''">CANCEL</button>
                            </div>
                            <div>
                                <button class="rounded py-2 px-3 bg-red-600 text-white tracking-widest font-normal w-full" (click)="deleteRoster(deleteId)">DELETE</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    }
</div>

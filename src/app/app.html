<app-navbar></app-navbar>
<router-outlet></router-outlet>

@defer {
    @if (updateModal) {
        <div id="updateModal" class="absolute top-0 bottom-0 left-0 right-0 z-500">
            <div class="inline">
                <div class="grid grid-cols-1 place-content-center h-full">
                    <div class="bg-white rounded w-2/3 opacity-100 justify-self-center p-3">
                        <p class="mb-3 text-center text-lg">New datafiles have been detected, update?</p>
                        <div class="grid grid-cols-2">
                            <div>
                                <button class="rounded py-2 px-3 tracking-widest font-normal w-full" (click)="updateModal = false">CANCEL</button>
                            </div>
                            <div>
                                <button class="rounded py-2 px-3 bg-lime-600 text-white tracking-widest font-normal w-full" (click)="setupDatafiles(core)">UPDATE</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    }
}
